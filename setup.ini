[metadata]
name = VOR-Monitoring-System
version = 5.2
author = Schalk Pieterse
author_email = schalkpieterse76@gmail.com
description = VOR / ASRACS / SAAF Airport Monitoring System with Glide Slope Detection
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/schalkpieterse76-afk/VOR-Monitoring--System
project_urls =
    Bug Tracker = https://github.com/schalkpieterse76-afk/VOR-Monitoring--System/issues
    Documentation = https://github.com/schalkpieterse76-afk/VOR-Monitoring--System#readme
    Source Code = https://github.com/schalkpieterse76-afk/VOR-Monitoring--System
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Development Status :: 4 - Beta
    Environment :: Win32 (MS Windows)
    Intended Audience :: End Users/Desktop
    Intended Audience :: Information Technology
    Intended Audience :: Science/Research
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Natural Language :: English
    Operating System :: Microsoft :: Windows
    Operating System :: Microsoft :: Windows :: Windows 7
    Operating System :: Microsoft :: Windows :: Windows 8
    Operating System :: Microsoft :: Windows :: Windows 10
    Operating System :: Microsoft :: Windows :: Windows 11
    Topic :: Scientific/Engineering :: Visualization
    Topic :: Multimedia :: Graphics :: Viewers
    Topic :: Communications
    Topic :: Internet

[options]
packages = find:
include_package_data = True
python_requires = >=3.8
install_requires =
    PyQt5>=5.15.0
    PyQtChart>=5.15.0
    PyOpenGL>=3.1.5
    PyOpenGL_accelerate>=3.1.5
    pyserial>=3.5
    numpy>=1.21.0
    PyYAML>=5.4.0

[options.packages.find]
where = .

[bdist_wheel]
universal = 0
